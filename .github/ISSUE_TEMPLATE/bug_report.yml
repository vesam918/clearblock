name: Bug report
description: Report reproducible ClearBlock behavior
title: "[Bug]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome and ClearBlock versions
    validations:
      required: true
